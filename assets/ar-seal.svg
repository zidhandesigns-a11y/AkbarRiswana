      M 210,195
      C 214,185 224,180 238,180
      C 246,180 254,185 258,195
      L 295,335
      C 298,345 304,350 315,350
      L 315,355
      L 265,355
      L 265,350
      C 275,350 280,345 276,335
      L 260,275
      L 198,275
      L 184,335
      C 180,345 186,350 196,350
      L 196,355
      L 148,355
      L 148,350
      C 158,350 166,344 170,332
