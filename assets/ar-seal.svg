<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560">
  <defs>
    <linearGradient id="goldPistaSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6ebd0"/>
      <stop offset="35%" stop-color="#99c490"/>
      <stop offset="70%" stop-color="#5a8b50"/>
      <stop offset="100%" stop-color="#3c6534"/>
    </linearGradient>
    <radialGradient id="sealShine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#99c490" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1d3816" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#233e1e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ornate Concentric Borders -->
  <g filter="url(#softGlow)" fill="none" stroke="url(#goldPistaSeal)">
    <!-- Outer beaded ring -->
    <circle cx="280" cy="280" r="260" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.65"/>
    <circle cx="280" cy="280" r="248" stroke-width="2.5"/>
    <circle cx="280" cy="280" r="236" stroke-width="0.8" opacity="0.8"/>
    
    <!-- Eight-Point Star Geometry Layer -->
    <rect x="70" y="70" width="420" height="420" stroke-width="0.75" opacity="0.35"/>
    <rect x="70" y="70" width="420" height="420" stroke-width="0.75" transform="rotate(45 280 280)" opacity="0.35"/>
    
    <!-- Inner medallion ring -->
    <circle cx="280" cy="280" r="195" stroke-width="1.2"/>
    <circle cx="280" cy="280" r="185" stroke-width="2.8"/>
    <circle cx="280" cy="280" r="175" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.6"/>
  </g>

  <!-- Wax Seal Center Fill with Radial Sheen -->
  <circle cx="280" cy="280" r="184" fill="url(#sealShine)"/>

  <!-- Decorative Laurel & Diamond Accents -->
  <g fill="url(#goldPistaSeal)">
    <!-- Top & Bottom Diamond Stars -->
    <polygon points="280,105 285,115 295,120 285,125 280,135 275,125 265,120 275,115"/>
    <polygon points="280,425 285,435 295,440 285,445 280,455 275,445 265,440 275,435"/>
    <circle cx="280" cy="120" r="2" fill="#ffffff"/>
    <circle cx="280" cy="440" r="2" fill="#ffffff"/>
  </g>

