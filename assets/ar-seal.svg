      C 292,260 298,248 298,236
      C 298,222 288,214 275,214
      C 260,214 250,226 250,240
      C 250,256 262,272 278,288
      C 258,306 244,324 244,345
      C 244,364 258,375 276,375
      C 295,375 312,362 312,342
      C 312,328 304,316 292,305
      L 316,335
      C 322,344 330,348 338,348
      L 338,352
      C 328,352 318,346 310,334
      L 286,300
      C 298,290 308,276 308,258
      C 308,232 292,220 274,220
      C 260,220 252,230 252,242
      C 252,258 266,275 285,290
      C 272,302 260,318 260,338
      C 260,356 270,366 284,366
      C 296,366 306,356 306,340
      C 306,324 296,308 285,295
      Z
    " opacity="0.88"/>

    <!-- LETTER 'R' -->
    <path d="
      M 292,195
      C 292,185 298,180 310,180
      L 364,180
      C 392,180 412,194 412,224
      C 412,246 398,264 376,270
      C 394,278 402,298 410,328
      C 414,342 420,348 430,350
      L 430,355
      L 385,355
      C 378,352 374,344 370,326
      C 364,296 354,282 334,282
      L 322,282
      L 322,332
      C 322,344 328,348 338,350
      L 338,355
      L 282,355
      L 282,350
      C 292,348 298,344 298,332
      L 298,203
      C 298,191 292,187 282,185
      L 282,180
      L 310,180
      Z
      M 322,200
      L 322,266
      L 358,266
      C 378,266 390,252 390,233
      C 390,214 378,200 358,200
      Z
    "/>
  </g>

  <!-- Bottom Year Inscription -->
  <text x="280" y="405" 
        font-family="'Playfair Display', 'Cormorant Garamond', serif" 
        font-size="14" 
        font-weight="500"
        letter-spacing="5" 
        fill="url(#goldPistaSeal)" 
        text-anchor="middle" 
        opacity="0.9">
    2026
  </text>
</svg>
