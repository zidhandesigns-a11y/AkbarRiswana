<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560">
  <defs>
    <linearGradient id="arPista" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a8850"/>
      <stop offset="50%" stop-color="#7aa571"/>
      <stop offset="100%" stop-color="#416b38"/>
    </linearGradient>
  </defs>

  <!-- Authentic Arabic Calligraphy for Alif & Ra (ا & ر) -->
  <g fill="url(#arPista)">
    <!-- ==================== ALIF (ا) ==================== -->
    <!-- Calligraphic Alif with classical Tarwees (crown hook) and tapering majestic shaft -->
    <path d="
      M 238,82
      C 230,86 218,94 212,106
      C 210,110 212,114 216,114
      C 222,114 230,105 238,100
      L 240,118
      C 240,160 236,220 234,270
      C 232,310 234,345 239,372
      C 241,380 245,384 248,378
      C 252,370 254,340 256,295
      C 258,245 260,175 258,118
      L 258,100
      C 264,96 268,91 266,85
      C 264,80 254,78 246,80
      Z
    " />

    <!-- ==================== RA (ر) ==================== -->
    <!-- Calligraphic Ra starting with bold crown, sweeping across and cradling beneath the Alif with a sharp ascending tail -->
    <path d="
      M 345,178
      C 358,172 376,174 384,184
      C 389,190 388,198 382,204
      C 374,212 360,216 348,222
      C 328,232 306,248 284,270
      C 260,294 240,324 216,358
      C 190,396 160,424 126,432
      C 112,435 104,428 108,418
      C 116,398 140,378 168,354
      C 202,324 238,288 272,254
      C 298,228 322,204 336,190
      C 342,184 345,180 345,178
      Z
    " />

    <!-- Sweeping lower calligraphic ribbon extending the tail of Ra -->
    <path d="
      M 126,432
      C 116,434 105,431 100,422
      C 94,410 98,392 108,372
      C 116,356 128,340 142,324
      C 146,320 152,322 150,328
      C 142,348 130,372 122,394
      C 118,406 118,414 124,416
      C 134,420 152,408 174,388
      C 160,404 142,422 126,432
      Z
    " />

    <!-- ==================== CALLIGRAPHIC ACCENTS (Nuqta & Harakat) ==================== -->
    <!-- Traditional diamond Nuqta accent above Ra -->
    <polygon points="365,130 382,147 365,164 348,147" />

    <!-- Small decorative floral flourish on left -->
    <circle cx="186" cy="180" r="5.5" opacity="0.85" />
    <path d="M 186,168 C 189,176 195,180 203,180 C 195,183 190,188 186,196 C 184,188 178,183 170,180 C 178,178 184,173 186,168 Z" opacity="0.6" />

    <!-- Subtle Arabic diacritic accent mark (Fatha flourish above Alif) -->
    <path d="
      M 242,50
      C 255,44 274,38 288,32
      C 292,30 295,33 292,36
      C 282,46 262,56 246,62
      C 241,64 238,60 242,50
      Z
    " opacity="0.8" />
  </g>
</svg>
